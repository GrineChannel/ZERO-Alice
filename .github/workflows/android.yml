
name: ZERO Alice Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Restore signing key
        env:
          ALICE_KEYSTORE_BASE64: ${{ secrets.ALICE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ALICE_KEYSTORE_BASE64" | base64 --decode > app/alice-release.p12
          test -s app/alice-release.p12

      - name: Build ZERO Alice
        uses: gradle/gradle-build-action@v3
        env:
          ALICE_STORE_PASSWORD: ${{ secrets.ALICE_STORE_PASSWORD }}
          ALICE_KEY_ALIAS: ${{ secrets.ALICE_KEY_ALIAS }}
          ALICE_KEY_PASSWORD: ${{ secrets.ALICE_KEY_PASSWORD }}
        with:
          gradle-version: 8.9
          arguments: --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Alice-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
